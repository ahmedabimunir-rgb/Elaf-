<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="elafBg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="250" cy="250" r="236" fill="url(#elafBg)" stroke="#27272a" stroke-width="3" />

  <!-- Inner ambient ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#222225" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <g transform="translate(15, 10)">
    <!-- White Script "Ela" -->
    <!-- 'E' Letterform -->
    <path d="M 175 190 C 150 170 120 190 120 225 C 120 270 165 300 215 285 C 235 280 248 270 252 262 C 248 266 232 272 215 272 C 175 272 142 248 142 218 C 142 196 158 184 175 184 C 196 184 212 198 215 215 C 205 215 195 220 195 230 C 195 240 205 245 215 245 C 230 245 242 232 242 215 C 242 192 215 170 175 190 Z" fill="#ffffff" />

    <!-- 'l' and 'a' Letterforms connected -->
    <path d="M 215 275 C 205 295 190 325 180 340 C 172 352 165 355 158 355 C 150 355 145 348 148 338 C 152 322 170 285 192 250 C 200 238 208 220 208 210 C 208 205 204 202 198 206 C 188 214 175 235 168 250 L 160 246 C 170 226 188 198 204 198 C 215 198 222 206 220 220 C 218 232 210 250 202 265 C 215 250 230 240 242 240 C 255 240 262 250 260 265 C 258 280 242 305 228 318 C 235 318 245 312 255 302 L 260 308 C 245 325 230 332 218 332 C 208 332 202 324 205 310 C 208 296 218 275 225 260 C 220 255 210 262 205 270 Z" fill="#ffffff" />

    <!-- Stylized Rooster 'f' in Vivid Crimson Red -->
    <!-- Rooster Comb / Crest -->
    <path d="M 295 160 C 290 145 298 135 310 135 C 316 135 320 140 322 148 C 328 140 338 138 348 142 C 354 144 358 150 357 158 C 365 152 376 153 382 160 C 386 166 384 175 378 182 C 374 187 368 190 360 190 C 352 190 345 186 342 180 C 335 186 325 188 315 185 C 305 182 298 172 295 160 Z" fill="#e11d48" filter="url(#subtleGlow)" />

    <!-- Rooster Head, Beak, Eye, and Descending 'f' Neck / Spine -->
    <path d="M 335 180 C 355 180 375 192 388 206 C 394 208 402 209 408 212 C 410 213 410 216 405 218 C 396 222 388 226 380 228 C 385 238 382 250 372 258 C 365 264 355 264 350 258 C 345 252 346 242 352 232 C 340 238 322 250 310 272 C 292 305 282 342 278 368 C 274 390 265 400 252 400 C 240 400 235 390 238 376 C 245 345 268 290 295 246 C 312 218 328 195 335 180 Z" fill="#e11d48" filter="url(#subtleGlow)" />

    <!-- Rooster Eye Detail -->
    <circle cx="362" cy="214" r="4.5" fill="#09090b" />
    <circle cx="363" cy="213" r="1.5" fill="#ffffff" />

    <!-- Rooster Wattle -->
    <path d="M 372 235 C 378 245 375 256 368 260 C 362 264 356 260 358 252 C 360 245 366 238 372 235 Z" fill="#be123c" />
  </g>

  <!-- RESTAURANT Typography -->
  <text x="250" y="386"
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif"
        font-size="21"
        font-weight="700"
        letter-spacing="9"
        fill="#f4f4f5"
        text-anchor="middle">RESTAURANT</text>

  <!-- Emblem Divider Line and Crown/Fork Icon -->
  <g transform="translate(0, 400)">
    <!-- Left line -->
    <line x1="170" y1="5" x2="225" y2="5" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
    <!-- Center Emblem (Stylized W / Crest) -->
    <path d="M 238 0 L 242 10 L 246 3 L 250 10 L 254 3 L 258 10 L 262 0" fill="none" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right line -->
    <line x1="275" y1="5" x2="330" y2="5" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
